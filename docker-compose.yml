services:
  postgres:
    image: postgres:17-alpine
    container_name: nepse-insight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nepse_insight}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: nepse-insight-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nepse-insight-backend
    restart: unless-stopped
    environment: &backend-environment
      DJANGO_SETTINGS_MODULE: config.settings.development
      DEBUG: "${DJANGO_DEBUG:-True}"
      SECRET_KEY: ${DJANGO_SECRET_KEY:-unsafe-development-key-not-for-production-32bytes}
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-nepse_insight}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      FRONTEND_URL: http://localhost:3000
      CRAWLER_USER_AGENT: "${CRAWLER_USER_AGENT:-NEPSEInsightBot/1.0 (+contact: configure-a-real-contact)}"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command:
      [
        "sh",
        "-c",
        "python manage.py migrate --noinput && daphne -b 0.0.0.0 -p 8000 config.asgi:application",
      ]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/schema/', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  celery-worker-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nepse-insight-celery-worker-1
    restart: unless-stopped
    environment: *backend-environment
    command:
      [
        "celery",
        "-A",
        "config",
        "worker",
        "--loglevel=info",
        "--concurrency=2",
        "--hostname=worker1@%h",
      ]
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nepse-insight-celery-worker-2
    restart: unless-stopped
    environment: *backend-environment
    command:
      [
        "celery",
        "-A",
        "config",
        "worker",
        "--loglevel=info",
        "--concurrency=2",
        "--hostname=worker2@%h",
      ]
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nepse-insight-celery-beat
    restart: unless-stopped
    environment: *backend-environment
    command:
      [
        "celery",
        "-A",
        "config",
        "beat",
        "--loglevel=info",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000/ws/updates/}
    container_name: nepse-insight-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
