services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "sh",
        "-c",
        "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\"",
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set a URL-safe REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: &backend-environment
      DJANGO_SETTINGS_MODULE: config.settings.production
      DEBUG: "False"
      SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in .env}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?Set PUBLIC_APP_URL in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in .env}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set CSRF_TRUSTED_ORIGINS in .env}
      SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-True}
      SECURE_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-31536000}
      SECURE_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_HSTS_INCLUDE_SUBDOMAINS:-False}
      SECURE_HSTS_PRELOAD: ${DJANGO_HSTS_PRELOAD:-False}
      DATABASE_URL: ${DATABASE_URL:?Set the external Supabase DATABASE_URL in .env}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD}@redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD}@redis:6379/2"
      CRAWLER_USER_AGENT: ${CRAWLER_USER_AGENT:?Set a crawler contact in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      STATIC_ROOT: /app/staticfiles
      MEDIA_ROOT: /app/media
    command:
      [
        "sh",
        "-c",
        "python manage.py migrate --noinput && python manage.py collectstatic --noinput --clear && exec daphne -b 0.0.0.0 -p 8000 config.asgi:application",
      ]
    expose:
      - "8000"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; request=urllib.request.Request('http://127.0.0.1:8000/api/schema/', headers={'Host':'localhost','X-Forwarded-Proto':'https'}); urllib.request.urlopen(request, timeout=5)",
        ]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 60s

  celery-worker-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *backend-environment
    command:
      [
        "celery",
        "-A",
        "config",
        "worker",
        "--loglevel=info",
        "--concurrency=2",
        "--hostname=worker1@%h",
      ]
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "config", "inspect", "ping", "--timeout=10"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  celery-worker-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *backend-environment
    command:
      [
        "celery",
        "-A",
        "config",
        "worker",
        "--loglevel=info",
        "--concurrency=2",
        "--hostname=worker2@%h",
      ]
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "config", "inspect", "ping", "--timeout=10"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *backend-environment
    command:
      [
        "celery",
        "-A",
        "config",
        "beat",
        "--loglevel=info",
        "--schedule=/var/lib/celerybeat/celerybeat-schedule",
      ]
    volumes:
      - celerybeat_data:/var/lib/celerybeat
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    environment:
      PORT: "80"
      NGINX_FRONTEND_UPSTREAM: frontend:3000
      NGINX_BACKEND_UPSTREAM: backend:8000
    command:
      [
        "/bin/sh",
        "-c",
        "envsubst '$$PORT $$NGINX_FRONTEND_UPSTREAM $$NGINX_BACKEND_UPSTREAM' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'",
      ]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf.template:ro
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  redis_data:
  static_data:
  media_data:
  celerybeat_data:
