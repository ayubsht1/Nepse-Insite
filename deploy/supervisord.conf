[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=10
autorestart=unexpected
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:daphne]
command=/usr/local/bin/daphne -b 127.0.0.1 -p 8000 config.asgi:application
directory=/app/backend
user=app
priority=20
autorestart=unexpected
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:nextjs]
command=/usr/local/bin/node /app/frontend/node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3000
directory=/app/frontend
user=app
priority=20
autorestart=unexpected
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:celery-worker-1]
command=/usr/local/bin/celery -A config worker --loglevel=info --concurrency=2 --hostname=worker1@%%h
directory=/app/backend
user=app
priority=30
autostart=true
autorestart=unexpected
startsecs=5
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:celery-worker-2]
command=/usr/local/bin/celery -A config worker --loglevel=info --concurrency=2 --hostname=worker2@%%h
directory=/app/backend
user=app
priority=30
autostart=true
autorestart=unexpected
startsecs=5
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:celery-beat]
command=/usr/local/bin/celery -A config beat --loglevel=info --schedule=/var/lib/celerybeat/celerybeat-schedule
directory=/app/backend
user=app
priority=30
autostart=true
autorestart=unexpected
startsecs=5
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
