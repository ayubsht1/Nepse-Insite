[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
logfile_maxbytes=0
loglevel=info
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=20
autostart=true
autorestart=unexpected
startsecs=2
redirect_stderr=true
stdout_logfile=/dev/null

[program:daphne]
command=/usr/local/bin/daphne -b 127.0.0.1 -p 8000 config.asgi:application
directory=/app/backend
priority=10
autostart=true
autorestart=unexpected
startsecs=5
redirect_stderr=true
stdout_logfile=/dev/null

[program:nextjs]
command=/usr/local/bin/node /app/frontend/node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3000
directory=/app/frontend
priority=10
autostart=true
autorestart=unexpected
startsecs=5
redirect_stderr=true
stdout_logfile=/dev/null
